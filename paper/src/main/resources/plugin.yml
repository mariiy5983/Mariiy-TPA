name: Mariiy-TPA
version: '${version}'
main: com.mariiy.tpa.paper.MariiyTpaPlugin
api-version: '1.16'
description: Lightweight TPA + /back for Bukkit/Spigot/Paper 1.20–26.2.
author: Mariiy
website: https://github.com/mariiy5983/Mariiy-TPA
folia-supported: false

commands:
  tpa:
    description: Request to teleport to a player
    usage: /tpa <player>
    permission: mariiytpa.use
  tpahere:
    description: Request a player to teleport to you
    usage: /tpahere <player>
    permission: mariiytpa.use
  tpacancel:
    description: Cancel your outgoing TPA request
    usage: /tpacancel
    permission: mariiytpa.use
  tpaccept:
    description: Accept a TPA request
    usage: /tpaccept
    aliases: [tpyes]
    permission: mariiytpa.use
  tpdeny:
    description: Deny a TPA request
    usage: /tpdeny
    aliases: [tpno]
    permission: mariiytpa.use
  back:
    description: Return to your previous teleport or death location
    usage: /back
    permission: mariiytpa.back

permissions:
  mariiytpa.use:
    description: Use TPA commands
    default: true
  mariiytpa.back:
    description: Use /back
    default: true
  mariiytpa.bypass:
    description: Bypass TPA cooldown
    default: op
  mariiytpa.reload:
    description: Reload Mariiy-TPA config
    default: op
